name: Unpack StudyShare

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: |
          unzip -o StudyShare-independent.zip -d extracted
          cp -r extracted/. .
          rm -rf extracted
          rm StudyShare-independent.zip

      - name: Commit project files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Unpack StudyShare project" || true
          git push
